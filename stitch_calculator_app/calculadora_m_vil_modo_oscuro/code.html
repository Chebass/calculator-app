<script>
  (() => {
    const display = document.getElementById('display-val');
    const keys = document.querySelectorAll('.key-tap');
    const degBtn = document.getElementById('deg-rad-btn');
    const hypBtn = document.getElementById('hyp-btn');
    const copyBtn = document.getElementById('copy-btn');
    
    let currentInput = "2,800";
    let isReset = false;

    keys.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const key = btn.getAttribute('data-key');
        if (!key) return;

        // Visual click wave pulse
        btn.classList.add('brightness-125');
        setTimeout(() => btn.classList.remove('brightness-125'), 120);

        if (key === 'ac') {
          currentInput = "0";
          isReset = true;
          display.textContent = currentInput;
          return;
        }

        if (key === 'backspace') {
          if (currentInput.length > 1 && currentInput !== "0") {
            currentInput = currentInput.slice(0, -1);
          } else {
            currentInput = "0";
          }
          display.textContent = currentInput;
          return;
        }

        if (key === '=') {
          display.classList.add('scale-105');
          setTimeout(() => display.classList.remove('scale-105'), 150);
          return;
        }

        if (key === 'pm') {
          if (currentInput.startsWith('-')) {
            currentInput = currentInput.slice(1);
          } else if (currentInput !== '0') {
            currentInput = '-' + currentInput;
          }
          display.textContent = currentInput;
          return;
        }

        if (/[0-9]/.test(key)) {
          if (currentInput === '0' || isReset) {
            currentInput = key;
            isReset = false;
          } else if (currentInput.length < 12) {
            currentInput += key;
          }
          display.textContent = currentInput;
          return;
        }

        if (key === '.' && !currentInput.includes('.')) {
          currentInput += '.';
          display.textContent = currentInput;
          return;
        }
      });
    });

    // DEG/RAD Toggle
    if (degBtn && hypBtn) {
      degBtn.addEventListener('click', () => {
        degBtn.classList.add('bg-surface-container-high', 'text-primary');
        degBtn.classList.remove('text-on-surface-variant');
        hypBtn.classList.remove('bg-surface-container-high', 'text-primary');
        hypBtn.classList.add('text-on-surface-variant');
      });

      hypBtn.addEventListener('click', () => {
        hypBtn.classList.add('bg-surface-container-high', 'text-primary');
        hypBtn.classList.remove('text-on-surface-variant');
        degBtn.classList.remove('bg-surface-container-high', 'text-primary');
        degBtn.classList.add('text-on-surface-variant');
      });
    }

    // Copy to clipboard indicator
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = `<span class="material-symbols-outlined text-[16px] text-primary">check</span><span class="font-label-sm text-label-sm text-primary">COPIED</span>`;
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 1200);
      });
    }
  })();
